[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ledger-api-client"
version = "0.1.0"
description = "Python client for the Pi Network mainnet ledger API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Frank35950" }
]
license = { text = "MIT" }
dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools]
packages = ["pi_ledger_api"]
